server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      # CORS 
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        - id: area-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/areas/**

        - id: disease-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/diseases/**

        - id: case-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/cases/**

      # tránh duplicate header CORS
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials